name: Charts

on:
  - push

jobs:
  create-charts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
      - name: Install Dependencies
        run: |
          pip install uv
          uv pip install --no-build pillow
          uv sync --frozen
      - name: Get Latest Stats
        run: |
          python -m DataViz.viz
      - name: Push to Repo
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git remote set-url --push origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          if [[ -n "$(git status --short)" ]]; then
            git commit -am "[Automated] Updating LeetCode Stat Charts"
            git push
          fi
